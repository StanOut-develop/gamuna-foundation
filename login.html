<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gamuna Foundation Admin Login</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  </head>
  <body class="admin-shell">
    <main class="login-card-wrap">
      <div class="login-card">
        <div class="login-brand">
          <img src="assets/logo.png" alt="Gamuna Foundation Logo" class="login-logo" />
          <div>
            <p class="eyebrow">Admin Portal</p>
            <h1>Gamuna Foundation</h1>
          </div>
        </div>

        <form id="loginForm" class="login-form">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" placeholder="Enter username" required />

          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Enter password" required />

          <button type="submit" class="btn btn-primary full-width">Log In</button>
          <p id="loginMessage" class="form-message" aria-live="polite"></p>
        </form>
      </div>
    </main>

    <script>
      const form = document.getElementById('loginForm');
      const message = document.getElementById('loginMessage');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        message.textContent = 'Signing in...';
        message.classList.remove('error');

        const payload = {
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        };

        try {
          const response = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message || 'Login failed.');
          }

          window.location.href = '/admin.html';
        } catch (error) {
          message.textContent = error.message;
          message.classList.add('error');
        }
      });
    </script>
  </body>
</html>
